<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biométrico - Sistema de Gestión (INIFAP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#249444',
                            'green-dark': '#1b7033',

                            dark: '#1A1A1B',
                            bg: '#F2F2F2',
                            white: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
   <style type="text/tailwindcss">
        @layer components {
            .tab-active { @apply border-brand-gold text-brand-green bg-brand-white shadow-sm font-bold scale-105 z-10; }
            .tab-inactive { @apply border-transparent text-brand-dark/60 hover:bg-brand-green/10; }
            .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #249444; border-radius: 5px; }
            .btn-primary { @apply bg-brand-green hover:bg-brand-green-dark text-brand-white px-5 py-2.5 rounded-xl transition-all shadow-md active:scale-95 flex items-center gap-2; }
            .btn-owa { @apply bg-[#0078D4] hover:bg-[#005a9e] text-white px-5 py-2.5 rounded-xl transition-all shadow-md active:scale-95 flex items-center gap-2; }
            
            :root {
                --inifap-green: #239547;
                --seed-orange: #f4a136;
                --seed-yellow: #fdd428;

            .inifap-logo-wrapper { display: flex; flex-direction: column; align-items: flex-start; }
            .logo-main { display: flex; align-items: baseline; font-family: "Arial Black", Gadget, sans-serif; font-size: 50px; color: var(--inifap-green); letter-spacing: -3px; user-select: none; }
            .letter { position: relative; display: inline-block; }
            .f-container { position: relative; display: inline-block; }
            .seed { position: absolute; width: 17px; height: 9px; background: linear-gradient(to bottom, var(--seed-orange) 50%, var(--seed-yellow) 50%); border-radius: 50%; top: 30px; left:2.5px; transform: rotate(-15deg); z-index: 20; border: 1px solid rgba(0,0,0,0.05); }
            .kern-in { letter-spacing: -4px; }
            .kern-ap { letter-spacing: -2px; }
            .logo-legend { font-family: Arial, Helvetica, sans-serif; font-size: 9px; color: var(--text-color); line-height: 1.3; font-weight: bold; max-width: 600px; }
        }
    </style-->
</head>

<body class="bg-brand-bg text-brand-dark min-h-screen flex flex-col font-sans">

    <nav class="bg-brand-white p-4 shadow-lg sticky top-0 z-50 border-b-4 border-brand-green">
        <div class="container mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="inifap-logo-wrapper">
                <div class="logo-main">
                    <span class="letter">i</span>
                    <span class="letter kern-in">n</span>
                    <span class="letter">i</span>
                    <div class="f-container">
                        <div class="seed"></div>
                        <span class="letter">f</span>
                    </div>
                    <span class="letter">a</span>
                    <span class="letter kern-ap">p</span>
                </div>
                <div class="logo-legend">
                    Instituto Nacional de Investigaciones<br>
                    Forestales, Agrícolas y Pecuarias
                </div>
            </div>

            <div class="flex-grow text-center hidden md:block">
                <span
                    class="text-2xl font-black text-brand-green tracking-widest uppercase italic text-center">Biométrico</span>
            </div>

            <div class="flex gap-2">
                <input type="file" id="upload" class="hidden" accept=".xlsx, .xlsm, .csv">
                <label for="upload" class="btn-primary cursor-pointer border border-white/20">
                    <span>📂</span> Cargar Reporte
                </label>
                <button id="exportBtn" disabled
                    class="bg-brand-dark/50 opacity-50 cursor-not-allowed text-brand-white px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2">
                    <span>📥</span> Exportar Todo
                </button>
                <button id="owaBtn" disabled
                    class="bg-brand-dark/50 opacity-50 cursor-not-allowed text-brand-white px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2">
                    <span>📧</span> Enviar por Correo
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-6 flex-grow">
        <div id="toolbar"
            class="hidden mb-6 flex items-center justify-between bg-white p-6 rounded-[2rem] shadow-sm border border-brand-green/10">
            <div class="relative w-full max-w-md">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 opacity-50">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar empleado..."
                    class="w-full pl-12 pr-4 py-3 bg-[#F0F4F4] border border-[#DDE4E4] rounded-2xl outline-none focus:ring-2 focus:ring-brand-green transition-all">
            </div>
            <div id="statsCounter" class="text-slate-600 font-medium pr-4"></div>
        </div>

        <div id="appContainer"
            class="hidden bg-brand-white rounded-3xl shadow-xl border border-brand-green/10 overflow-hidden flex flex-col min-h-[600px]">
            <div class="flex border-b border-brand-green/10 bg-brand-bg/50 overflow-x-auto custom-scrollbar"
                id="tabContainer"></div>
            <div id="tabContent" class="flex-grow p-6 md:p-8"></div>
        </div>

        <div id="emptyState" class="py-32 text-center">
            <div class="max-w-md mx-auto bg-brand-white p-10 rounded-[3rem] shadow-sm border border-brand-green/10">
                <div class="text-6xl mb-4">📊</div>
                <h2 class="text-2xl font-bold text-brand-green tracking-tight">Biométrico INIFAP</h2>
                <p class="text-brand-dark/60 mt-2">Cargue el reporte oficial <b>RH_CONTROL_ASISTENCIA_V2</b> para
                    comenzar la gestión de incidencias.</p>
            </div>
        </div>
    </main>

    <footer class="w-full py-4 text-center text-[11px] text-slate-400 bg-transparent tracking-wide">
        <div class="container mx-auto flex justify-center items-center gap-4">
            <span>Sistema de Gestión de Incidencias</span>
            <span class="text-slate-300">|</span>
            <span>Accesos al sitio: <b id="visitCounter" class="text-slate-500 font-bold">0</b></span>
            <span class="text-slate-300">|</span>
            <span>Documentos procesados: <b id="filesCounter" class="text-slate-500 font-bold">0</b></span>
        </div>
    </footer>

    <script>
        let groupedData = {};
        let rawHeader = [];

        const uploadInput = document.getElementById('upload');
        const exportBtn = document.getElementById('exportBtn');
        const owaBtn = document.getElementById('owaBtn');
        const searchInput = document.getElementById('searchInput');

        // --- INICIALIZACIÓN DE CONTADORES EN SEGUNDO PLANO ---
        window.addEventListener('DOMContentLoaded', () => {
            let visitas = parseInt(localStorage.getItem('biometrico_visitas') || '0');
            visitas++;
            localStorage.setItem('biometrico_visitas', visitas);
            document.getElementById('visitCounter').textContent = visitas;

            let archivos = parseInt(localStorage.getItem('biometrico_archivos') || '0');
            document.getElementById('filesCounter').textContent = archivos;
        });

        function incrementarContadorArchivos() {
            let archivos = parseInt(localStorage.getItem('biometrico_archivos') || '0');
            archivos++;
            localStorage.setItem('biometrico_archivos', archivos);
            document.getElementById('filesCounter').textContent = archivos;
        }

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                processData(rows);
            };
            reader.readAsArrayBuffer(file);
        });

        function processData(rows) {
            groupedData = {};
            let dataStarted = false;
            rows.forEach((row, index) => {
                if (!dataStarted) {
                    if (row[0] !== "" && !isNaN(row[0]) && row[0] !== null) {
                        dataStarted = true;
                        rawHeader = rows[index - 1] || [];
                    } else return;
                }
                const empId = String(row[0]).trim();
                if (!empId || empId === "undefined") return;
                if (!groupedData[empId]) {
                    groupedData[empId] = { nombre: (row[2] || "Empleado").trim(), rows: [] };
                }
                groupedData[empId].rows.push(row);
            });
            if (Object.keys(groupedData).length > 0) {
                document.getElementById('statsCounter').innerHTML = `Total: <span class="text-brand-green font-bold text-lg">${Object.keys(groupedData).length} empleados</span> detectados`;
                renderTabs();
            }
        }

        function getRowVisualClass(row) {
            if (row[13] && row[13] !== "") return "bg-red-500 text-white font-bold";
            if (row[12] && row[12] !== "") return "bg-orange-600 text-white";
            if (row[11] && row[11] !== "") return "bg-orange-400 text-black";
            if (row[10] && row[10] !== "") return "bg-yellow-400 text-black";
            return "bg-[#E9F5E9] text-brand-dark/80";
        }

        function renderTabs(filter = "") {
            const tabContainer = document.getElementById('tabContainer');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('toolbar').classList.remove('hidden');

            exportBtn.disabled = false;
            exportBtn.className = "btn-primary";
            owaBtn.disabled = false;
            owaBtn.className = "btn-owa";

            tabContainer.innerHTML = "";
            const ids = Object.keys(groupedData).filter(id =>
                groupedData[id].nombre.toLowerCase().includes(filter.toLowerCase()) || id.includes(filter)
            );

            ids.forEach((id, index) => {
                const tabBtn = document.createElement('button');
                tabBtn.className = `px-5 py-4 text-[11px] font-bold uppercase whitespace-nowrap border-b-4 transition-all ${index === 0 ? 'tab-active' : 'tab-inactive'}`;
                tabBtn.innerHTML = id;
                tabBtn.onclick = () => switchTab(id, tabBtn);
                tabContainer.appendChild(tabBtn);
                if (index === 0) switchTab(id, tabBtn);
            });
        }

        function switchTab(id, element) {
            document.querySelectorAll('#tabContainer button').forEach(b => b.classList.replace('tab-active', 'tab-inactive'));
            element.classList.replace('tab-inactive', 'tab-active');
            const emp = groupedData[id];
            document.getElementById('tabContent').innerHTML = `
                <h2 class="text-2xl font-black mb-4 uppercase tracking-tighter text-brand-green">${emp.nombre}</h2>
                <div class="overflow-x-auto rounded-xl border border-brand-green/20">
                    <table class="w-full text-[10px]">
                        <thead class="bg-[#D9D9D9] font-bold">
                            <tr>${rawHeader.map(h => `<th class="p-2 border border-black/10 text-center">${h}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                            ${emp.rows.map(r => `
                                <tr class="${getRowVisualClass(r)}">
                                    ${r.map(c => `<td class="p-2 border border-black/5 text-center">${c instanceof Date ? c.toLocaleDateString() : c}</td>`).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        searchInput.addEventListener('input', (e) => renderTabs(e.target.value));

        // --- FUNCIÓN DE GENERACIÓN DE EXCEL (TU FORMATO ORIGINAL) ---
        function generateWorkbook() {
            const wb = XLSX.utils.book_new();
            const fondoHoja = "E9F5E9";
            const MaxFila = 200;
            const MaxCol = 26;

            Object.keys(groupedData).forEach(id => {
                const emp = groupedData[id];
                const wsData = [
                    ["inifap", "", "INSTITUTO NACIONAL DE INVESTIGACIONES FORESTALES AGRÍCOLAS Y PECUARIAS"],
                    ["Instituto Nacional de Investigaciones", "", "COORDINACIÓN DE ADMINISTRACIÓN Y SISTEMAS"],
                    ["Forestales, Agrícolas y Pecuarias", "", "DIRECCIÓN DE DESARROLLO HUMANO Y PROFESIONALIZACIÓN"],
                    ["", "", "INCIDENCIAS GENERADAS DE ACUERDO AL REGISTRO ELECTRÓNICO V2"],
                    ["", "", "Reporte: RH_CONTROL_ASISTENCIA_V2"],
                    [],
                    rawHeader,
                    ...emp.rows
                ];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!ref'] = `A1:${XLSX.utils.encode_col(MaxCol - 1)}${MaxFila}`;
                ws['!view'] = { showGridLines: false };
                ws['!merges'] = [
                    { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 1 } },
                    { s: { r: 2, c: 0 }, e: { r: 2, c: 1 } }, { s: { r: 0, c: 2 }, e: { r: 0, c: 5 } },
                    { s: { r: 1, c: 2 }, e: { r: 1, c: 5 } }, { s: { r: 2, c: 2 }, e: { r: 2, c: 5 } },
                    { s: { r: 3, c: 2 }, e: { r: 3, c: 5 } }, { s: { r: 4, c: 2 }, e: { r: 4, c: 5 } }
                ];

                const tableRows = wsData.slice(6);
                const colWidths = rawHeader.map((_, colIndex) => {
                    if (colIndex === 0) return { wch: 15 };
                    let maxWidth = 10;
                    tableRows.forEach(row => {
                        const cellValue = row[colIndex];
                        const text = cellValue ? String(cellValue) : "";
                        const currentWidth = cellValue instanceof Date ? 12 : text.length + 2;
                        if (currentWidth > maxWidth) maxWidth = currentWidth;
                    });
                    return { wch: maxWidth };
                });
                ws['!cols'] = colWidths;

                for (let r = 0; r < MaxFila; r++) {
                    for (let c = 0; c < MaxCol; c++) {
                        const cellRef = XLSX.utils.encode_cell({ r: r, c: c });
                        if (!ws[cellRef]) ws[cellRef] = { v: "" };
                        let style = { fill: { type: 'pattern', pattern: 'solid', fgColor: { rgb: fondoHoja } }, font: { sz: 9, name: "Arial" }, alignment: { vertical: "center", horizontal: "center" } };
                        if (r === 0 && c === 0) { style.font = { bold: true, sz: 24, color: { rgb: "249444" }, name: "Arial Black" }; style.alignment.horizontal = "left"; }
                        if (r >= 1 && r <= 2 && c >= 0 && c <= 1) { style.font = { sz: 8, color: { rgb: "1A1A1B" }, bold: true }; style.alignment.horizontal = "left"; style.alignment.wrapText = true; }
                        if (r >= 0 && r <= 4 && c >= 2 && c <= 5) { style.font = { sz: 9, bold: true }; }
                        if (r === 6 && c < rawHeader.length) { style.fill = { type: 'pattern', pattern: 'solid', fgColor: { rgb: "D9D9D9" } }; style.font.bold = true; style.border = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } }; }
                        if (r >= 7) {
                            const dRow = emp.rows[r - 7];
                            if (dRow && c < rawHeader.length) {
                                let bgColor = fondoHoja; let fontColor = "000000";
                                if (dRow[13]) { bgColor = "FF0000"; fontColor = "FFFFFF"; } else if (dRow[12]) { bgColor = "E46C0A"; fontColor = "FFFFFF"; } else if (dRow[11]) { bgColor = "FFC000"; } else if (dRow[10]) { bgColor = "FFFF00"; }
                                style.fill = { type: 'pattern', pattern: 'solid', fgColor: { rgb: bgColor } }; style.font.color = { rgb: fontColor }; style.border = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } };
                            }
                        }
                        ws[cellRef].s = style;
                    }
                }
                XLSX.utils.book_append_sheet(wb, ws, id.substring(0, 31));
            });
            return wb;
        }

        exportBtn.addEventListener('click', () => {
            const wb = generateWorkbook();
            XLSX.writeFile(wb, `Reporte_Biometrico_INIFAP.xlsx`);
            incrementarContadorArchivos();
        });

        // --- LÓGICA DE ENVÍO SEGURO OWA ---
        owaBtn.addEventListener('click', () => {
            const wb = generateWorkbook();
            XLSX.writeFile(wb, "Reporte_PARA_ENVIAR.xlsx");
            incrementarContadorArchivos();

            const destinatario = "lopez.brenda@inifap.gob.mx";
            const asunto = encodeURIComponent("Reporte Biométrico de Asistencia - INIFAP");
            const cuerpo = encodeURIComponent("Buen día,\n\nAdjunto envío el reporte de incidencias generado por el sistema.\n\nATENCIÓN: POR FAVOR, ADJUNTE EL ARCHIVO 'Reporte_PARA_ENVIAR.xlsx' QUE SE ACABA DE DESCARGAR.\n\nSaludos.");

            window.location.href = `mailto:${destinatario}?subject=${asunto}&body=${cuerpo}`;

            alert("❗ PASO IMPORTANTE ❗\n\n" +
                "1. El archivo Excel se ha descargado.\n" +
                "2. Se abrirá su correo institucional.\n\n" +
                "⚠️ POR FAVOR, NO OLVIDE ADJUNTAR EL ARCHIVO: \n" +
                "'Reporte_PARA_ENVIAR.xlsx'");
        });
    </script>
</body>

</html>
